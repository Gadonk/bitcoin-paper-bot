name: Publish v3 release
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-v3
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release and set image tags
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]] || { echo "Expected stable v3.x.y release"; exit 1; }
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:v3
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
            VCS_REF=${{ steps.version.outputs.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
